services:
  chromadb:
    ports: !override
      - "127.0.0.1:18141:8000"
  elasticsearch:
    ports: !override
      - "127.0.0.1:19241:9200"
  api:
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
