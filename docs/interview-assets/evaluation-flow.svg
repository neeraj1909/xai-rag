<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="RAGAS request decisions and score interpretation">
<title>RAGAS request decisions and score interpretation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#157a73"/></marker></defs>
<rect width="900" height="440" rx="16" fill="#f4f7f4"/>
<g font-family="DejaVu Sans, sans-serif" fill="#18312f"><text x="32" y="40" font-size="23" font-weight="bold">RAGAS request decisions and score interpretation</text><rect x="30" y="90" width="250" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="155.0" y="117" text-anchor="middle" font-size="18" font-weight="bold">Request RAGAS?</text><text x="155.0" y="140" text-anchor="middle" font-size="14">include_ragas flag</text><rect x="325" y="90" width="250" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="117" text-anchor="middle" font-size="18" font-weight="bold">Server allows it?</text><text x="450.0" y="140" text-anchor="middle" font-size="14">allow_request_evaluation</text><rect x="620" y="90" width="250" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="745.0" y="117" text-anchor="middle" font-size="18" font-weight="bold">Dependencies + judge</text><text x="745.0" y="140" text-anchor="middle" font-size="14">Construct and score metrics</text><path d="M280,124 L325,124" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M575,124 L620,124" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="260" width="250" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="155.0" y="287" text-anchor="middle" font-size="18" font-weight="bold">Not requested</text><text x="155.0" y="310" text-anchor="middle" font-size="14">Optional NLI aggregate or zero</text><rect x="325" y="260" width="250" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="287" text-anchor="middle" font-size="18" font-weight="bold">Disabled</text><text x="450.0" y="310" text-anchor="middle" font-size="14">Request rejected</text><rect x="620" y="260" width="250" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="745.0" y="287" text-anchor="middle" font-size="12.88135593220339" font-weight="bold">Computed / unavailable / error</text><text x="745.0" y="310" text-anchor="middle" font-size="13.739545997610513">Inspect status before the score</text><path d="M155,158 L155,260" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M450,158 L450,260" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M745,158 L745,260" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="32" y="375" font-size="16">Success: valid RAGAS faithfulness supplies overall_confidence.</text><text x="32" y="403" font-size="16">Requested failure: overall_confidence is zero; that is not a measured judge verdict.</text></g></svg>