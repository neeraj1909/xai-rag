<g font-family="DejaVu Sans, sans-serif" fill="#18312f"><text x="32" y="40" font-size="23" font-weight="bold">Reciprocal rank fusion: contributions remain distinct</text><text x="32" y="75" font-size="16">Illustrative ranks; k = 60. Score = sum of 1 / (k + rank) where present.</text><text x="35" y="137" font-size="18">A</text><rect x="100" y="112" width="278.6885245901639" height="32" fill="#157a73"/><rect x="378.6885245901639" y="112" width="269.8412698412698" height="32" fill="#ac681a"/><text x="720" y="135" font-size="18">0.032266</text><text x="35" y="199" font-size="18">B</text><rect x="100" y="174" width="274.19354838709677" height="32" fill="#157a73"/><rect x="374.19354838709677" y="174" width="278.6885245901639" height="32" fill="#ac681a"/><text x="720" y="197" font-size="18">0.032522</text><text x="35" y="261" font-size="18">C</text><rect x="100" y="236" width="269.8412698412698" height="32" fill="#157a73"/><rect x="369.8412698412698" y="236" width="0" height="32" fill="#ac681a"/><text x="720" y="259" font-size="18">0.015873</text><text x="35" y="323" font-size="18">D</text><rect x="100" y="298" width="0" height="32" fill="#157a73"/><rect x="100" y="298" width="274.19354838709677" height="32" fill="#ac681a"/><text x="720" y="321" font-size="18">0.016129</text><text x="32" y="402" font-size="16">Teal: dense contribution. Ochre: lexical contribution. B outranks A in this example.</text></g></svg>