<rect width="900" height="720" rx="16" fill="#f4f7f4"/>
<g font-family="DejaVu Sans, sans-serif" fill="#18312f"><text x="32" y="40" font-size="23" font-weight="bold">Document ingestion: ordered writes and visible failure</text><rect x="220" y="75" width="460" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="102" text-anchor="middle" font-size="18" font-weight="bold">Discover + bound</text><text x="450.0" y="125" text-anchor="middle" font-size="14">Root, file count, byte limits</text><path d="M450,143 L450,168" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="170" width="460" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="197" text-anchor="middle" font-size="18" font-weight="bold">Parse + chunk</text><text x="450.0" y="220" text-anchor="middle" font-size="14">Exact source spans; chosen strategy</text><path d="M450,238 L450,263" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="265" width="460" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="292" text-anchor="middle" font-size="18" font-weight="bold">Embed children</text><text x="450.0" y="315" text-anchor="middle" font-size="14">Pinned retrieval model and dimension</text><path d="M450,333 L450,358" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="360" width="460" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="387" text-anchor="middle" font-size="18" font-weight="bold">Write Chroma</text><text x="450.0" y="410" text-anchor="middle" font-size="14">Stable IDs; replace stale source records</text><path d="M450,428 L450,453" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="220" y="455" width="460" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="482" text-anchor="middle" font-size="18" font-weight="bold">Write Elasticsearch</text><text x="450.