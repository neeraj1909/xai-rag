<g font-family="DejaVu Sans, sans-serif" fill="#18312f"><text x="32" y="40" font-size="23" font-weight="bold">Three evidence views: an important evaluation boundary</text><rect x="285" y="75" width="330" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="102" text-anchor="middle" font-size="18" font-weight="bold">Ranked retrieval results</text><text x="450.0" y="125" text-anchor="middle" font-size="14">Child content + optional parent text</text><rect x="30" y="210" width="240" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="150.0" y="237" text-anchor="middle" font-size="18" font-weight="bold">Generator</text><text x="150.0" y="260" text-anchor="middle" font-size="12.345679012345679">Parent/text, character truncation</text><path d="M450,143 L150,210" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="330" y="210" width="240" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="237" text-anchor="middle" font-size="18" font-weight="bold">RAGAS</text><text x="450.0" y="260" text-anchor="middle" font-size="14">Full parent/text list</text><path d="M450,143 L450,210" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="630" y="210" width="240" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="750.0" y="237" text-anchor="middle" font-size="18" font-weight="bold">NLI</text><text x="750.0" y="260" text-anchor="middle" font-size="14">Claim-scoped child text</text><path d="M450,143 L750,210" stroke="#157a73" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="40" y="325" font-size="17">These evidence views can differ. A score must be interpreted with its exact inputs.</text><rect x="240" y="375" width="420" height="68" rx="8" fill="white" stroke="#157a73" stroke-width="2"/><text x="450.0" y="402" text-anchor="middle" font-size="18" font-weight="bold">Proposed capture improvement</text><tex