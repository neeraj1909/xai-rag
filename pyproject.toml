[project]
name = "xai-rag"
version = "0.1.0"
description = "Explainable RAG with retrieval attribution, NLI faithfulness scoring, and hybrid search"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Neeraj Kumar Singh", email = "neeraj1909@gmail.com" }]

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    # Vector database
    "chromadb-client>=1.5.9",
    # Embeddings & ML
    "sentence-transformers>=3.3.0",
    "transformers>=4.47.0",
    "torch>=2.5.0",
    # Search
    "elasticsearch[async]>=8.0.0,<9.0.0",
    # LLM
    "openai>=1.58.0",
    # Observability
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # Document processing
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    # Utilities
    "click>=8.1.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "sse-starlette>=2.2.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "testcontainers[elasticsearch]>=4.9.0",
]

[project.scripts]
xai-rag = "xai_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xai_rag"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
